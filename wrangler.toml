name = "novastack"
compatibility_date = "2026-07-10"
main = "worker/index.ts"

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Append-only server-side consent-proof log (DSGVO Art. 7 Abs. 1), see
# src/lib/consentLog.ts and functions/api/consent-log.ts.
[[kv_namespaces]]
binding = "CONSENT_LOG"
id = "7114e1d7cd194a02a30bed9fec511622"

# Booking-Queue für die LeadWerk-Integration, siehe
# functions/api/leadwerk-pending.ts und src/leadwerk-app.md (Memory).
[[kv_namespaces]]
binding = "LEADWERK_QUEUE"
id = "eb9f8790b79c4431bf6fea1311cb5d2e"
